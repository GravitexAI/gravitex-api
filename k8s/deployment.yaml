apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: gravitex-ap-southeast-1.cr.bytepluses.com/gravitex/api-gateway:1.0.15
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secret
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: prod
spec:
  selector:
    app: api-gateway      
  ports:
  - name: http
    protocol: TCP
    port: 3000            
    targetPort: 3000      
  type: ClusterIP
