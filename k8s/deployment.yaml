apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: prod
spec:
  progressDeadlineSeconds: 1800
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: api-gateway

      terminationGracePeriodSeconds: 600

      initContainers:
      - name: sysctl-init
        image: busybox:1.36
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          sysctl -w net.core.somaxconn=65535
          sysctl -w net.ipv4.tcp_max_syn_backlog=65535
          sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          sysctl -w net.ipv4.tcp_tw_reuse=1
          sysctl -w net.ipv4.tcp_fin_timeout=15
          sysctl -w net.ipv4.tcp_keepalive_time=120
          sysctl -w net.ipv4.tcp_keepalive_intvl=30
          sysctl -w net.ipv4.tcp_keepalive_probes=3
      containers:
      - name: api-gateway
        image: gravitex-ap-southeast-1.cr.bytepluses.com/gravitex/api-gateway:1.0.75
        ports:
        - containerPort: 3000
        env:
        - name: TZ
          value: "Asia/Shanghai"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SHUTDOWN_TIMEOUT_SECONDS
          value: "540"
        envFrom:
        - configMapRef:
            name: api-gateway-config

        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 30"]

        startupProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30

        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 2

        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 10
          failureThreshold: 3

        resources:
          requests:
            cpu: "4000m"
            memory: "20Gi"
          limits:
            cpu: "8000m"
            memory: "20Gi"
        volumeMounts:
        - name: api-gateway-stg
          mountPath: /data/logs
          subPathExpr: $(NODE_NAME)
      volumes:
      - name: api-gateway-stg
        persistentVolumeClaim:
          claimName: api-gateway-prod-claim
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: prod
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
