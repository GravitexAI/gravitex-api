apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-test
  namespace: test
spec:
  replicas: 2 # 固定启动 2 个 Pod 实例
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway-test
  template:
    metadata:
      labels:
        app: api-gateway-test
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: sysctl-init
        image: busybox:1.36
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          sysctl -w net.core.somaxconn=65535
          sysctl -w net.ipv4.tcp_max_syn_backlog=65535
          sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          sysctl -w net.ipv4.tcp_tw_reuse=1
          sysctl -w net.ipv4.tcp_fin_timeout=15
          sysctl -w net.ipv4.tcp_keepalive_time=120
          sysctl -w net.ipv4.tcp_keepalive_intvl=30
          sysctl -w net.ipv4.tcp_keepalive_probes=3
      containers:
      - name: api-gateway-test
        image: gravitex-ap-southeast-1.cr.bytepluses.com/gravitex/api-gateway-test:1.0.33
        ports:
        - containerPort: 3000
        env:
        - name: TZ
          value: "Asia/Shanghai"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: api-gateway-test-config
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 15"]
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
          limits:
            cpu: "8000m"
            memory: "16Gi"
        volumeMounts:
        - name: api-gateway-test-stg
          mountPath: /data/logs
          subPathExpr: $(NODE_NAME)
      volumes:
      - name: api-gateway-test-stg
        persistentVolumeClaim:
          claimName: api-gateway-claim
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-test-svc
  namespace: test
spec:
  selector:
    app: api-gateway-test
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
