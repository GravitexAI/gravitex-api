apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-test
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-test
  template:
    metadata:
      labels:
        app: api-gateway-test
    spec:
      containers:
      - name: api-gateway-test
        image: gravitex-ap-southeast-1.cr.bytepluses.com/gravitex/api-gateway-test:1.0.4
        ports:
        - containerPort: 3000
        env:                          
        - name: TZ                    
          value: "Asia/Shanghai"      
        envFrom:
        - configMapRef:
            name: api-gateway-test-config
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "16000m"
            memory: "32Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway-test-svc
  namespace: test
spec:
  selector:
    app: api-gateway-test      
  ports:
  - name: http
    protocol: TCP
    port: 3000            
    targetPort: 3000      
  type: ClusterIP
