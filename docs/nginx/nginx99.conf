worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /run/nginx.pid;

worker_rlimit_nofile 1000000;

events {
    worker_connections  1000000;
    multi_accept        on;
    use                 epoll;
}

http {
    # ========= MIME 类型 =========
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests    10000;
    types_hash_max_size 4096;
    server_tokens   off;

    # ===================== 全局核心优化：大请求 + 长超时 =====================
    # 最大请求体（支持超大图片/文件）
    client_max_body_size 1024M;
    # 请求体缓冲区（消除写入临时文件警告）
    client_body_buffer_size 512k;
    client_body_in_single_buffer on;
    client_body_timeout 300s;

    # 代理全局超时（拉到最大，24小时）
    proxy_connect_timeout 10s;
    proxy_send_timeout    86400s;
    proxy_read_timeout    86400s;
    
    # 代理缓冲区优化
    proxy_buffering       on;
    proxy_buffer_size     32k;
    proxy_buffers         8 128k;
    proxy_busy_buffers_size 256k;

    # 日志
    #log_format main '$remote_addr - $remote_user [$time_local] "$request" '
     #               '$status $body_bytes_sent "$http_referer" '
      #              '"$http_user_agent" "$http_x_forwarded_for"';
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
	            '$status $body_bytes_sent "$http_referer" '
	            '"$http_user_agent" "$upstream_addr" '
		    'rt=$request_time ut=$upstream_response_time';
    
    access_log /var/log/nginx/access.log main;

    # 后端集群
    upstream backend_servers {
	keepalive 1000;    
        server localhost:3000;
        server localhost:3003 backup;
    }

    # WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  101.47.158.99 _;

        # ========= 根路径：不提供前端 =========
        location = / {
            return 404;
        }

        # ========= BytePlus 真人活体核验回调页（gravitex-api 内置 //go:embed HTML） =========
        # 精确匹配 /asset-validate-callback.html，反代到 gravitex-api 后端进程
        # 页面里的 JS 会再 fetch /v1/visual-validate/result，由下面 ^/(api/|...|v1|...) 反代
        location = /asset-validate-callback.html {
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_pass http://backend_servers;
            proxy_buffering off;
            proxy_cache off;
        }

        # ========= 核心1：匹配 /assets/ 所有资源（解决/assets/xxx 404） =========
        location /assets/ {
            root /usr/share/nginx/admin_api/;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
            location ~* \.js$ {
                add_header Content-Type application/javascript always;
            }
        }

        # ========= 核心2：匹配根路径的独立静态资源 =========
        location ~* ^/[^/]*\.(png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/admin_api/;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }

        # ========= 核心3：SPA前端 /admin_api 映射 =========
        location /admin_api {
            root /usr/share/nginx;
            index index.html;
            try_files $uri $uri/ /admin_api/index.html break;
            autoindex off;
            charset utf-8;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # ========= 核心4：/admin_api下的JS/CSS单独优化 =========
        location ~* ^/admin_api/.*\.(js|mjs)$ {
            root /usr/share/nginx;
            add_header Content-Type application/javascript always;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }

        # ========= 拦截特定埋点 API =========
        location = /api/event_logging/batch {
            default_type application/json;
            return 200 '{"code":0,"msg":"success"}';
        }

        # ========= 后端 API 代理 =========
        location ~ ^/(api/|mj|pg|v1|v1beta) {
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;
            proxy_pass http://backend_servers;

            # 长连接超时（流式/大模型专用）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
            
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # ========= 错误页 =========
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
