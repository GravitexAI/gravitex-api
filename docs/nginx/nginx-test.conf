worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /run/nginx.pid;

worker_rlimit_nofile 1000000;

events {
    worker_connections  1000000;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    server_tokens   off;

    # 大文件 & 长请求优化
    client_max_body_size 500M;
    client_body_buffer_size 512k;
    client_body_in_single_buffer on;
    client_body_timeout 300s;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==============================================
    # 【80 端口】主站点：maas 前端 + 接口代理
    # ==============================================
    server {
        listen       80;
        listen       [::]:80;
        server_name  101.47.154.214;

        # 前端根目录
        root   /usr/share/nginx/maas;
        index  index.html;

        # ---------------- 80端口接口转发规则 ----------------
        # 1. /llm-api  → 转发到 127.0.0.1:3000
        location ^~ /llm-api/ {
            proxy_pass https://api.gravitex.ai/;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # 2. /prod-api → 转发到 127.0.0.1:8080
        location ^~ /prod-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # 前端 SPA 路由（最后匹配）
        location / {
            try_files $uri $uri/ /index.html;
            autoindex off;
            charset utf-8;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|svg|woff|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }
    }

    # ==============================================
    # 【3000 端口】gravitex-api（Go embed，前端已内嵌二进制）
    # Go 服务监听 3003，nginx 监听 3000 对外暴露，全部反代给 Go
    # 不再需要 nginx 托管静态文件目录
    # ==============================================
    server {
        listen       3000;
        listen       [::]:3000;
        server_name  101.47.154.214;

        # 全部流量反代到 Go 服务（静态文件 + API 均由 Go 处理）
        location / {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
    # ==============================================
    # 【5666 端口】system 前端 + 接口代理
    # ==============================================
    server {
        listen       5666;
        listen       [::]:5666;
        server_name  101.47.154.214;

        # 后台前端目录
        root   /usr/share/nginx/system;
        index  index.html;

        # ---------------- 80端口接口转发规则 ----------------
        # 1. /llm-api  → 转发到 127.0.0.1:3000
        location ^~ /llm-api/ {
            proxy_pass https://vke-api.gravitex.ai/;
            # proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # 2. /prod-api → 转发到 127.0.0.1:8080
        location ^~ /prod-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }
        # 后台前端 SPA 路由
        location / {
            try_files $uri $uri/ /index.html;
            autoindex off;
            charset utf-8;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|svg|woff|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }

	    # ========== 4. 大屏显示页面 ==========
	    location /llm-api-dv/ {
		            proxy_pass http://127.0.0.1:3000/;
			            proxy_set_header New-Api-User 1;
				            proxy_set_header Authorization "Bearer iU5yJth2UYJ5kn/Zj2SEf7qMxUclDg==";
					        }

    }

    # docs.gravitex.ai 域名配置 - 适配LB层SSL，解决循环重定向
    server {
        listen       80;
        server_name  docs.gravitex.ai;


        # 4. 文档站点 - 反向代理到 Next.js (端口 5173)
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}