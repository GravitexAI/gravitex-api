worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /run/nginx.pid;

worker_rlimit_nofile 1000000;

events {
    worker_connections  1000000;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    server_tokens   off;

    # 大文件 & 长请求优化
    client_max_body_size 500M;
    client_body_buffer_size 512k;
    client_body_in_single_buffer on;
    client_body_timeout 300s;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==============================================
    # 【80 端口】主站点：maas 前端 + 接口代理
    # ==============================================
    server {
        listen       80;
        listen       [::]:80;
        server_name  101.47.154.214;

        # 前端根目录
        root   /usr/share/nginx/maas;
        index  index.html;

        # ---------------- 80端口接口转发规则 ----------------
        # 1. /llm-api  → 转发到 127.0.0.1:3000
        location ^~ /llm-api/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # 2. /prod-api → 转发到 127.0.0.1:8080
        location ^~ /prod-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # 前端 SPA 路由（最后匹配）
        location / {
            try_files $uri $uri/ /index.html;
            autoindex off;
            charset utf-8;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|svg|woff|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }
    }

    # ==============================================
    # 【3000 端口】admin_api 前端 + 接口代理
    # ==============================================
    server {
        listen       3000;
        listen       [::]:3000;
        server_name  101.47.154.214;

        # 后台前端目录
        root   /usr/share/nginx/admin_api;
        index  index.html;

        # ---------------- 3000端口接口转发规则 ----------------
        # api/ | mj | pg | v1 | v1beta → 转发到 127.0.0.1:3000
        location ~ ^/(api|mj|pg|v1|v1beta) {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # BytePlus 真人活体核验回调页（gravitex-api 内置 HTML 资源，必须反代后端）
        # 路径精确匹配，避免被 SPA fallback 吃掉
        location = /asset-validate-callback.html {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 后台前端 SPA 路由
        location / {
            try_files $uri $uri/ /index.html;
            autoindex off;
            charset utf-8;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|svg|woff|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }
    }
    # ==============================================
    # 【3000 端口】admin_api 前端 + 接口代理
    # ==============================================
    server {
        listen       5666;
        listen       [::]:5666;
        server_name  101.47.154.214;

        # 后台前端目录
        root   /usr/share/nginx/system;
        index  index.html;

        # ---------------- 80端口接口转发规则 ----------------
        # 1. /llm-api  → 转发到 127.0.0.1:3000
        location ^~ /llm-api/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # 2. /prod-api → 转发到 127.0.0.1:8080
        location ^~ /prod-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }
        # 后台前端 SPA 路由
        location / {
            try_files $uri $uri/ /index.html;
            autoindex off;
            charset utf-8;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|svg|woff|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
