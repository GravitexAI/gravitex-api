# maas.gravitex.ai 域名配置 - 适配LB层SSL，解决循环重定向
server {
    listen       80;
    server_name  maas.gravitex.ai;

    # ===================== 核心优化：支持大请求 + 长超时 =====================
    client_max_body_size 500M;                # 最大请求体 500MB
    client_body_buffer_size 512k;             # 请求缓冲区加大，避免写磁盘
    client_body_in_single_buffer on;          # 保证body一次性读入内存
    client_body_timeout 300s;                  # 客户端传输超时加长

    # ========== 核心修复：仅对真实HTTP请求跳转，忽略LB转发的HTTPS请求 ==========
    # X-Forwarded-Proto: https → LB转发的HTTPS请求，不跳转
    # X-Forwarded-Proto: http 或无此头 → 真实HTTP请求，跳转HTTPS
    #if ($http_x_forwarded_proto != 'https') {
    #    return 301 https://$server_name$request_uri;
    #}

    # ========== 原有业务逻辑，完全保留 ==========
    # 1. prod-api 接口代理
    location ^~ /prod-api/ {
    #    proxy_pass http://127.0.0.1:8080/;
        proxy_pass http://backend_servers/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 超时大幅加长
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # 流式输出必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }

    # 新增：llm-api 接口代理（适配低版本Nginx，修复301重定向+POST转GET问题）
    location ^~ /llm-api/ {
        # 跨域配置（严格限定来源，避免*带来的问题）
        add_header Access-Control-Allow-Origin "https://maas.gravitex.ai" always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header Access-Control-Allow-Credentials 'true' always;
        
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 已修改：转发到 101.47.10.65
        proxy_pass http://101.47.10.65/;
        
        # 头部（已修复：正确写法 proxy_set_header）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # 关闭自动重定向
        proxy_redirect off;

        # WebSocket & 流式
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ===================== 关键：超长时间配置，支持大模型流式 =====================
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # 关闭缓冲（流式必须）
        proxy_buffering off;
        proxy_cache off;
    }

    # ========== 注释掉不需要的后端API代理块 ==========
    # 后端API代理（含WebSocket支持）
    #location ~ ^/(api|mj|pg|v1|v1beta) {
    #		proxy_set_header Host $http_host;
    #		proxy_set_header X-Real-IP $remote_addr;
    #		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #		proxy_set_header X-Forwarded-Proto $scheme;
    #
    #		# WebSocket必需配置
    #		proxy_http_version 1.1;
    #		proxy_set_header Upgrade $http_upgrade;
    #		proxy_set_header Connection $connection_upgrade;
    #
    #		proxy_redirect off;
    #		proxy_pass http://127.0.0.1:3000;
    #
    #		# WebSocket长连接超时
    #		proxy_read_timeout 3600s;
    #		proxy_send_timeout 3600s;
    #
    #		# 主服务错误时自动切备用
    #		proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    #}

    # 4. 前端静态资源
    location / {
        root   maas;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
